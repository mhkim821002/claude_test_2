<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat Body -->
  <ellipse cx="100" cy="120" rx="45" ry="50" fill="#ff9a56" stroke="#000" stroke-width="2"/>

  <!-- Cat Head -->
  <circle cx="100" cy="70" r="35" fill="#ff9a56" stroke="#000" stroke-width="2"/>

  <!-- Left Ear -->
  <polygon points="75,45 70,20 85,40" fill="#ff9a56" stroke="#000" stroke-width="2"/>
  <polygon points="75,40 72,25 82,38" fill="#ffb380"/>

  <!-- Right Ear -->
  <polygon points="125,45 130,20 115,40" fill="#ff9a56" stroke="#000" stroke-width="2"/>
  <polygon points="125,40 128,25 118,38" fill="#ffb380"/>

  <!-- Left Eye -->
  <ellipse cx="88" cy="65" rx="6" ry="10" fill="#000"/>
  <ellipse cx="89" cy="63" rx="2" ry="3" fill="#fff"/>

  <!-- Right Eye -->
  <ellipse cx="112" cy="65" rx="6" ry="10" fill="#000"/>
  <ellipse cx="113" cy="63" rx="2" ry="3" fill="#fff"/>

  <!-- Nose -->
  <polygon points="100,75 97,80 103,80" fill="#ff6b9d"/>

  <!-- Mouth -->
  <path d="M 100 80 Q 95 85 90 83" stroke="#000" stroke-width="1.5" fill="none"/>
  <path d="M 100 80 Q 105 85 110 83" stroke="#000" stroke-width="1.5" fill="none"/>

  <!-- Whiskers Left -->
  <line x1="70" y1="70" x2="50" y2="68" stroke="#000" stroke-width="1"/>
  <line x1="70" y1="75" x2="50" y2="75" stroke="#000" stroke-width="1"/>
  <line x1="70" y1="80" x2="50" y2="82" stroke="#000" stroke-width="1"/>

  <!-- Whiskers Right -->
  <line x1="130" y1="70" x2="150" y2="68" stroke="#000" stroke-width="1"/>
  <line x1="130" y1="75" x2="150" y2="75" stroke="#000" stroke-width="1"/>
  <line x1="130" y1="80" x2="150" y2="82" stroke="#000" stroke-width="1"/>

  <!-- Left Front Leg -->
  <rect x="75" y="155" width="12" height="35" rx="6" fill="#ff9a56" stroke="#000" stroke-width="2"/>
  <ellipse cx="81" cy="188" rx="8" ry="5" fill="#ff9a56" stroke="#000" stroke-width="1.5"/>

  <!-- Right Front Leg -->
  <rect x="113" y="155" width="12" height="35" rx="6" fill="#ff9a56" stroke="#000" stroke-width="2"/>
  <ellipse cx="119" cy="188" rx="8" ry="5" fill="#ff9a56" stroke="#000" stroke-width="1.5"/>

  <!-- Left Back Leg -->
  <rect x="60" y="150" width="12" height="30" rx="6" fill="#ff9a56" stroke="#000" stroke-width="2"/>
  <ellipse cx="66" cy="178" rx="8" ry="5" fill="#ff9a56" stroke="#000" stroke-width="1.5"/>

  <!-- Right Back Leg -->
  <rect x="128" y="150" width="12" height="30" rx="6" fill="#ff9a56" stroke="#000" stroke-width="2"/>
  <ellipse cx="134" cy="178" rx="8" ry="5" fill="#ff9a56" stroke="#000" stroke-width="1.5"/>

  <!-- Tail -->
  <path d="M 140 120 Q 170 100 175 70" stroke="#ff9a56" stroke-width="15" fill="none" stroke-linecap="round"/>
  <path d="M 140 120 Q 170 100 175 70" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Belly -->
  <ellipse cx="100" cy="130" rx="30" ry="35" fill="#ffcc99"/>
</svg>
